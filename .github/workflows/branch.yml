name: Branch Build

# Runs on every push to any feature branch (anything that is not main or
# development) and on manual dispatch.  Builds both platform installers and
# uploads them as workflow artifacts so contributors can download and test
# the build directly from the workflow run.  No GitHub Release is created
# and no container image is pushed to a registry.

on:
  push:
    branches-ignore:
      - main
      - development
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Windows – Inno Setup installer
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # -----------------------------------------------------------------------
      - name: Determine build version
        id: version
        shell: pwsh
        run: |
          $shortSha = '${{ github.sha }}'.Substring(0, 7)
          $branch   = '${{ github.ref_name }}' -replace '[^a-zA-Z0-9._-]', '-'
          $version  = "0.0.0-branch.$branch.$shortSha"
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build version: $version"

      # -----------------------------------------------------------------------
      - name: Cache Launch4j
        id: cache-launch4j
        uses: actions/cache@v4
        with:
          path: launch4j
          key: launch4j-3.50-win32

      - name: Download Launch4j
        if: steps.cache-launch4j.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download'
          Invoke-WebRequest -Uri $url -OutFile launch4j.zip -UserAgent 'Wget/1.21'
          Expand-Archive -Path launch4j.zip -DestinationPath .
          Remove-Item launch4j.zip

      # -----------------------------------------------------------------------
      - name: Cache JDK (Temurin 21)
        id: cache-jdk
        uses: actions/cache@v4
        with:
          path: jdk
          key: temurin-jdk-21-windows-x64

      - name: Download JDK (Eclipse Temurin 21)
        if: steps.cache-jdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $jdkUrl = 'https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse'
          Invoke-WebRequest -Uri $jdkUrl -OutFile jdk.zip
          Expand-Archive -Path jdk.zip -DestinationPath jdk-temp
          $jdkDir = Get-ChildItem -Path jdk-temp -Directory | Select-Object -First 1
          Move-Item -Path $jdkDir.FullName -Destination jdk
          Remove-Item -Recurse -Force jdk-temp
          Remove-Item jdk.zip

      # -----------------------------------------------------------------------
      - name: Build minimal JRE with jlink
        shell: pwsh
        run: |
          $jdepsExe = '.\jdk\bin\jdeps.exe'
          $jlinkExe = '.\jdk\bin\jlink.exe'

          # Discover required modules dynamically from the JAR
          $modules = & $jdepsExe --multi-release 21 --ignore-missing-deps `
            --print-module-deps files/EW-Unified-4.0.005-FIPS.jar
          if ($LASTEXITCODE -ne 0) { throw "jdeps failed with exit code $LASTEXITCODE" }
          Write-Host "Modules required by JAR: $modules"

          # Build a minimal JRE into the jre/ directory
          & $jlinkExe `
            --module-path ".\jdk\jmods" `
            --add-modules $modules `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress zip-6 `
            --output jre
          if ($LASTEXITCODE -ne 0) { throw "jlink failed with exit code $LASTEXITCODE" }

          $sizeMB = [math]::Round((Get-ChildItem -Recurse jre | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Minimal JRE created in jre\ ($sizeMB MB)"

      # -----------------------------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # -----------------------------------------------------------------------
      - name: Prepare build directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build | Out-Null

      # -----------------------------------------------------------------------
      - name: Update version info in Launch4j config
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          # Use a safe four-part version for the Windows EXE manifest (branch builds use 0.0.0.0)
          $v4      = '0.0.0.0'
          # Launch4j limits free-form version strings to 50 characters
          $txtVersion = if ($version.Length -gt 50) { $version.Substring(0, 50) } else { $version }
          $content = Get-Content -Path config/launch4j.xml -Raw
          $content = $content -replace '<fileVersion>[^<]+</fileVersion>',            "<fileVersion>$v4</fileVersion>"
          $content = $content -replace '<txtFileVersion>[^<]+</txtFileVersion>',       "<txtFileVersion>$txtVersion</txtFileVersion>"
          $content = $content -replace '<productVersion>[^<]+</productVersion>',       "<productVersion>$v4</productVersion>"
          $content = $content -replace '<txtProductVersion>[^<]+</txtProductVersion>', "<txtProductVersion>$txtVersion</txtProductVersion>"
          Set-Content -Path config/launch4j.xml -Value $content
          Write-Host "Version info set to $txtVersion"

      # -----------------------------------------------------------------------
      - name: Build EXE with Launch4j
        shell: pwsh
        run: |
          & .\launch4j\launch4jc.exe config\launch4j.xml
          if (-not (Test-Path 'build\EncryptionWizard.exe')) {
            throw "Launch4j did not produce build\EncryptionWizard.exe"
          }
          Write-Host "EXE created: build\EncryptionWizard.exe"

      # -----------------------------------------------------------------------
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DAppVersion=$version config\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Write-Host "Installer created in build\"

      # -----------------------------------------------------------------------
      - name: Build Windows portable archive (ZIP)
        shell: pwsh
        run: |
          $version    = '${{ steps.version.outputs.VERSION }}'
          $archiveDir = 'archive-win'
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null

          # Application EXE (JAR embedded by Launch4j)
          Copy-Item "build\EncryptionWizard.exe" "$archiveDir\"

          # Bundled JRE
          Copy-Item -Recurse "jre" "$archiveDir\jre"

          # Documentation and support files
          Copy-Item "files\Encryption Wizard User Guide v405.docx"             "$archiveDir\"
          Copy-Item "files\Encryption Wizard User Guide v405.pdf"              "$archiveDir\"
          Copy-Item "files\Getting_Started_with_Encryption_Wizard_4.0.005.txt" "$archiveDir\"
          Copy-Item "files\Drop_Jar_File_Here_For_Fallback_Launch.bat"         "$archiveDir\"
          Copy-Item "files\Encryption Wizard homepage.url"                     "$archiveDir\"

          Compress-Archive -Path "$archiveDir\*" `
            -DestinationPath "build\EncryptionWizard-${version}-Windows.zip" `
            -CompressionLevel Optimal
          Remove-Item -Recurse -Force $archiveDir

          $sizeMB = [math]::Round((Get-Item "build\EncryptionWizard-${version}-Windows.zip").Length / 1MB, 1)
          Write-Host "Windows archive created: build\EncryptionWizard-${version}-Windows.zip ($sizeMB MB)"

      # -----------------------------------------------------------------------
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/EncryptionWizard-*-Setup.exe
            build/EncryptionWizard-*-Windows.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Linux – makeself installer
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # -----------------------------------------------------------------------
      - name: Determine build version
        id: version
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          BRANCH=$(echo '${{ github.ref_name }}' | tr -c 'a-zA-Z0-9._-' '-')
          echo "VERSION=0.0.0-branch.${BRANCH}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Build version: 0.0.0-branch.${BRANCH}.${SHORT_SHA}"

      # -----------------------------------------------------------------------
      - name: Cache JDK (Temurin 21)
        id: cache-jdk
        uses: actions/cache@v4
        with:
          path: jdk
          key: temurin-jdk-21-linux-x64

      - name: Download JDK (Eclipse Temurin 21)
        if: steps.cache-jdk.outputs.cache-hit != 'true'
        run: |
          curl -fL 'https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse' \
            -o jdk.tar.gz
          mkdir jdk-temp
          tar -xzf jdk.tar.gz -C jdk-temp
          mv "jdk-temp/$(ls jdk-temp)" jdk
          rmdir jdk-temp
          rm jdk.tar.gz

      # -----------------------------------------------------------------------
      - name: Build minimal JRE with jlink
        run: |
          MODULES=$(./jdk/bin/jdeps \
            --multi-release 21 \
            --ignore-missing-deps \
            --print-module-deps \
            files/EW-Unified-4.0.005-FIPS.jar)
          echo "Modules required by JAR: $MODULES"

          ./jdk/bin/jlink \
            --module-path ./jdk/jmods \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress zip-6 \
            --output jre

          echo "Minimal JRE created: $(du -sh jre | cut -f1)"

      # -----------------------------------------------------------------------
      - name: Install makeself
        run: sudo apt-get install -y makeself

      - name: Build Linux installer (makeself)
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          mkdir -p build payload

          cp files/EW-Unified-4.0.005-FIPS.jar payload/
          cp -r jre/ payload/jre/

          # Launcher script embedded inside the makeself archive
          cat > payload/run.sh << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$DIR/jre/bin/java" -jar "$DIR/EW-Unified-4.0.005-FIPS.jar" "$@"
          LAUNCHER
          chmod +x payload/run.sh

          makeself \
            --nox11 \
            --sha256 \
            payload/ \
            "build/EncryptionWizard-${VERSION}-Linux.run" \
            "Encryption Wizard ${VERSION}" \
            ./run.sh

          rm -rf payload
          echo "Linux installer: $(du -sh "build/EncryptionWizard-${VERSION}-Linux.run" | cut -f1)"

      # -----------------------------------------------------------------------
      - name: Build Linux portable archive (tar.gz)
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          ARCHIVE_DIR='archive-linux'
          mkdir -p "$ARCHIVE_DIR"

          # Application JAR
          cp files/EW-Unified-4.0.005-FIPS.jar "$ARCHIVE_DIR/"

          # Bundled JRE
          cp -r jre/ "$ARCHIVE_DIR/jre/"

          # Documentation and support files
          cp "files/Encryption Wizard User Guide v405.docx"             "$ARCHIVE_DIR/"
          cp "files/Encryption Wizard User Guide v405.pdf"              "$ARCHIVE_DIR/"
          cp "files/Getting_Started_with_Encryption_Wizard_4.0.005.txt" "$ARCHIVE_DIR/"
          cp "files/Encryption Wizard homepage.url"                     "$ARCHIVE_DIR/"

          # Launcher script
          cat > "$ARCHIVE_DIR/run.sh" << 'LAUNCHER'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          JAR=$(ls "$DIR"/EW-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then echo "Error: No EW-*.jar found in $DIR" >&2; exit 1; fi
          exec "$DIR/jre/bin/java" -jar "$JAR" "$@"
          LAUNCHER
          chmod +x "$ARCHIVE_DIR/run.sh"

          tar -czf "build/EncryptionWizard-${VERSION}-Linux.tar.gz" -C "$ARCHIVE_DIR" .
          rm -rf "$ARCHIVE_DIR"

          echo "Linux archive: $(du -sh "build/EncryptionWizard-${VERSION}-Linux.tar.gz" | cut -f1)"

      # -----------------------------------------------------------------------
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/EncryptionWizard-*-Linux.run
            build/EncryptionWizard-*-Linux.tar.gz
          retention-days: 14
