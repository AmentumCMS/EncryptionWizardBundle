name: Build Native Executables (GraalVM)

# Reusable workflow for building GraalVM native executables.
# Called by both dev.yml (for pre-release builds) and release.yml (for release builds).

on:
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      ew_version:
        description: 'Encryption Wizard version (e.g. 4.0.005)'
        required: true
        type: string
      bundle_version:
        description: 'Bundle version string (e.g. 1.0.0 or 0.0.0-dev.abc1234)'
        required: true
        type: string
      is_release:
        description: 'Whether this is a release build (affects artifact retention: 1 day vs 14 days)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ew_version:
        description: 'Encryption Wizard version'
        required: true
        type: string
      bundle_version:
        description: 'Bundle version string'
        required: true
        type: string
      is_release:
        description: 'Whether this is a release build (affects artifact retention)'
        required: false
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Build native executable for Linux x64
  # ---------------------------------------------------------------------------
  build-linux-native:
    name: Build Linux native executable
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          native-image --version

      - name: Build native executable
        run: |
          EW_VERSION='${{ inputs.ew_version }}'
          BUNDLE_VERSION='${{ inputs.bundle_version }}'
          COMBINED_VERSION="EW-${EW_VERSION}_Bundle-${BUNDLE_VERSION}"
          mkdir -p build

          echo "Building native executable for Linux..."
          echo "EW Version: $EW_VERSION, Bundle Version: $BUNDLE_VERSION"
          native-image \
            -jar files/EW-Unified-4.0.005-FIPS.jar \
            -H:Name=encryption-wizard \
            -H:Path=build \
            -H:ConfigurationFileDirectories=config/graalvm \
            --no-fallback \
            --enable-url-protocols=https \
            --verbose \
            2>&1 | tee native-image-build.log || {
              echo "Native image build failed, checking for fallback..."
              if grep -q "Fallback" native-image-build.log; then
                echo "Build required fallback - this means some reflection/resources are missing"
              fi
              exit 1
            }

          # Create distributable archive
          cd build
          chmod +x encryption-wizard
          tar -czvf "EncryptionWizard-${COMBINED_VERSION}-linux-x64-native.tar.gz" encryption-wizard
          rm encryption-wizard

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-artifacts
          path: build/EncryptionWizard-*-linux-x64-native.tar.gz
          retention-days: ${{ inputs.is_release && 1 || 14 }}

  # ---------------------------------------------------------------------------
  # Build native executable for macOS ARM64 (Apple Silicon)
  # ---------------------------------------------------------------------------
  build-macos-arm64-native:
    name: Build macOS ARM64 native executable
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          native-image --version

      - name: Build native executable
        run: |
          EW_VERSION='${{ inputs.ew_version }}'
          BUNDLE_VERSION='${{ inputs.bundle_version }}'
          COMBINED_VERSION="EW-${EW_VERSION}_Bundle-${BUNDLE_VERSION}"
          mkdir -p build

          echo "Building native executable for macOS ARM64..."
          echo "EW Version: $EW_VERSION, Bundle Version: $BUNDLE_VERSION"
          native-image \
            -jar files/EW-Unified-4.0.005-FIPS.jar \
            -H:Name=encryption-wizard \
            -H:Path=build \
            -H:ConfigurationFileDirectories=config/graalvm \
            --no-fallback \
            --enable-url-protocols=https \
            --verbose

          # Create distributable archive
          cd build
          chmod +x encryption-wizard
          tar -czvf "EncryptionWizard-${COMBINED_VERSION}-macos-arm64-native.tar.gz" encryption-wizard
          rm encryption-wizard

      - name: Upload macOS ARM64 native artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-native-artifacts
          path: build/EncryptionWizard-*-macos-arm64-native.tar.gz
          retention-days: ${{ inputs.is_release && 1 || 14 }}

  # ---------------------------------------------------------------------------
  # Build native executable for Windows x64
  # ---------------------------------------------------------------------------
  build-windows-native:
    name: Build Windows native executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          java -version
          native-image --version

      - name: Set up Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Extract icon from JAR
        shell: pwsh
        run: |
          # Extract icon from JAR for native image
          $jarFile = Get-ChildItem -Path "files" -Filter "EW-*.jar" | Select-Object -First 1
          Expand-Archive -Path $jarFile.FullName -DestinationPath jar-extract -Force

          # Verify icon exists and copy it
          $iconPath = "jar-extract/res/images/icon"
          if (-not (Test-Path $iconPath)) { throw "Icon file not found in JAR: $iconPath" }

          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item $iconPath "build/icon.ico"
          Write-Host "Extracted icon.ico for native image"

          # Cleanup extracted JAR contents (keep only the icon)
          Remove-Item -Recurse -Force jar-extract

      - name: Build native executable
        shell: pwsh
        run: |
          $ewVersion = '${{ inputs.ew_version }}'
          $bundleVersion = '${{ inputs.bundle_version }}'
          $combinedVersion = "EW-${ewVersion}_Bundle-${bundleVersion}"
          New-Item -ItemType Directory -Force -Path build | Out-Null

          Write-Host "Building native executable for Windows..."
          Write-Host "EW Version: $ewVersion, Bundle Version: $bundleVersion"
          native-image `
            -jar files/EW-Unified-4.0.005-FIPS.jar `
            -H:Name=encryption-wizard `
            -H:Path=build `
            -H:ConfigurationFileDirectories=config/graalvm `
            -H:NativeImageIcon=build/icon.ico `
            --no-fallback `
            --enable-url-protocols=https `
            --verbose

          if (-not (Test-Path 'build\encryption-wizard.exe')) {
            throw "Native image build failed - no executable produced"
          }

          # Create distributable archive
          Compress-Archive -Path build\encryption-wizard.exe -DestinationPath "build\EncryptionWizard-${combinedVersion}-windows-x64-native.zip"
          Remove-Item build\encryption-wizard.exe

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-artifacts
          path: build/EncryptionWizard-*-windows-x64-native.zip
          retention-days: ${{ inputs.is_release && 1 || 14 }}
