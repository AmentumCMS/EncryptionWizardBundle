name: Pre-release Build

# Manual workflow to create pre-release native executables from any branch.
# This allows testing native builds before merging to main/development.
# Artifacts are uploaded to the workflow run and optionally to a pre-release.

on:
  workflow_dispatch:
    inputs:
      create_prerelease:
        description: 'Create a GitHub pre-release with artifacts'
        required: false
        type: boolean
        default: false
      prerelease_tag:
        description: 'Tag name for pre-release (e.g., v1.0.0-beta.1)'
        required: false
        type: string

jobs:
  # ---------------------------------------------------------------------------
  # Compute version
  # ---------------------------------------------------------------------------
  compute-version:
    name: Compute build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Determine build version
        id: version
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          BRANCH=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9]/-/g')
          if [ -n "${{ inputs.prerelease_tag }}" ]; then
            VERSION="${{ inputs.prerelease_tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-${BRANCH}.${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

  # ---------------------------------------------------------------------------
  # Build native executables
  # ---------------------------------------------------------------------------
  build-native:
    name: Build native executables
    needs: [compute-version]
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}
      is_release: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Create pre-release (optional)
  # ---------------------------------------------------------------------------
  create-prerelease:
    name: Create pre-release
    needs: [compute-version, build-native]
    if: inputs.create_prerelease && inputs.prerelease_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux native artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-native-artifacts
          path: release-artifacts

      - name: Download macOS x64 native artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-native-artifacts
          path: release-artifacts

      - name: Download macOS ARM64 native artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-native-artifacts
          path: release-artifacts

      - name: Download Windows native artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-native-artifacts
          path: release-artifacts

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.prerelease_tag }}
          name: Encryption Wizard ${{ inputs.prerelease_tag }} (Pre-release)
          body: |
            ## Pre-release Build

            This is a pre-release build from branch `${{ github.ref_name }}` at commit `${{ github.sha }}`.

            ### Native Executables (GraalVM)
            These are standalone executables that do not require Java to be installed:
            - `EncryptionWizard-*-linux-x64-native.tar.gz` - Linux x64
            - `EncryptionWizard-*-macos-x64-native.tar.gz` - macOS Intel
            - `EncryptionWizard-*-macos-arm64-native.tar.gz` - macOS Apple Silicon
            - `EncryptionWizard-*-windows-x64-native.zip` - Windows x64

            **Note:** These native executables support CLI mode only. For GUI mode, use the standard installers from a full release.
          draft: false
          prerelease: true
          files: release-artifacts/*
