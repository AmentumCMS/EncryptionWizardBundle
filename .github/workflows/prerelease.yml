name: Pre-release Build

# Manual workflow to create pre-release native executables from any branch.
# This allows testing native builds before merging to main/development.
# Artifacts are uploaded to the workflow run and optionally to a pre-release.

on:
  workflow_dispatch:
    inputs:
      create_prerelease:
        description: 'Create a GitHub pre-release with artifacts'
        required: false
        type: boolean
        default: false
      prerelease_tag:
        description: 'Tag name for pre-release (e.g., v1.0.0-beta.1)'
        required: false
        type: string

jobs:
  # ---------------------------------------------------------------------------
  # Compute version
  # ---------------------------------------------------------------------------
  compute-version:
    name: Compute build version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ew_version: ${{ steps.ew-version.outputs.EW_VERSION }}
      bundle_version: ${{ steps.version.outputs.BUNDLE_VERSION }}
      combined_version: ${{ steps.combined.outputs.COMBINED_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Detect EW version from JAR filename
        id: ew-version
        run: |
          JAR_FILE=$(ls files/EW-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No EW-*.jar file found in files directory" >&2
            exit 1
          fi
          EW_VERSION=$(basename "$JAR_FILE" | sed -n 's/EW-[^-]*-\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p')
          if [ -z "$EW_VERSION" ]; then
            echo "Error: Could not extract version from JAR filename: $(basename "$JAR_FILE")" >&2
            exit 1
          fi
          echo "EW_VERSION=$EW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Encryption Wizard version: $EW_VERSION"

      - name: Determine bundle version
        id: version
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          BRANCH=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9]/-/g')
          if [ -n "${{ inputs.prerelease_tag }}" ]; then
            BUNDLE_VERSION="${{ inputs.prerelease_tag }}"
            BUNDLE_VERSION="${BUNDLE_VERSION#v}"
          else
            BUNDLE_VERSION="0.0.0-${BRANCH}.${SHORT_SHA}"
          fi
          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bundle version: $BUNDLE_VERSION"

      - name: Create combined version
        id: combined
        run: |
          EW_VERSION='${{ steps.ew-version.outputs.EW_VERSION }}'
          BUNDLE_VERSION='${{ steps.version.outputs.BUNDLE_VERSION }}'
          COMBINED_VERSION="EW-${EW_VERSION}_Bundle-${BUNDLE_VERSION}"
          echo "COMBINED_VERSION=$COMBINED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Combined version: $COMBINED_VERSION"

  # ---------------------------------------------------------------------------
  # Build native executables
  # ---------------------------------------------------------------------------
  build-native:
    name: Build native executables
    needs: [compute-version]
    permissions:
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      ew_version: ${{ needs.compute-version.outputs.ew_version }}
      bundle_version: ${{ needs.compute-version.outputs.bundle_version }}
      is_release: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Create pre-release (optional)
  # ---------------------------------------------------------------------------
  create-prerelease:
    name: Create pre-release
    needs: [compute-version, build-native]
    if: inputs.create_prerelease && inputs.prerelease_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux native artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-native-artifacts
          path: release-artifacts

      - name: Download macOS x64 native artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-x64-native-artifacts
          path: release-artifacts

      - name: Download macOS ARM64 native artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-native-artifacts
          path: release-artifacts

      - name: Download Windows native artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-native-artifacts
          path: release-artifacts

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.prerelease_tag }}
          name: Encryption Wizard ${{ needs.compute-version.outputs.combined_version }} (Pre-release)
          body: |
            ## Pre-release Build

            This is a pre-release build from branch `${{ github.ref_name }}` at commit `${{ github.sha }}`.

            **Encryption Wizard Version:** ${{ needs.compute-version.outputs.ew_version }}
            **Bundle Version:** ${{ needs.compute-version.outputs.bundle_version }}

            ### Native Executables (GraalVM)
            These are standalone executables that do not require Java to be installed:
            - `EncryptionWizard-*-linux-x64-native.tar.gz` - Linux x64
            - `EncryptionWizard-*-macos-arm64-native.tar.gz` - macOS Apple Silicon
            - `EncryptionWizard-*-windows-x64-native.zip` - Windows x64

            **Note:** These native executables support CLI mode only. For GUI mode, use the standard installers from a full release.
          draft: false
          prerelease: true
          files: release-artifacts/*
